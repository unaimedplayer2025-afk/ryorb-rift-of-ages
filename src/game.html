<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RyOrb: Rift of Ages (1985 // 2098)</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000}
  #mute{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:5;width:40px;height:40px;border-radius:8px;border:2px solid #ff2a2a;background:rgba(20,0,0,.6);color:#ff6a5a;font:bold 18px monospace;cursor:pointer}
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
  body.touch #touch{display:block}
  .tb{position:absolute;pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(120,10,10,.35);border:2px solid rgba(255,80,60,.55);color:#ffd8d0;font:bold 15px monospace;display:flex;align-items:center;justify-content:center}
  .tb.on{background:rgba(255,60,40,.5)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<button id="mute" title="Mute (M)">&#128266;</button>
<div id="touch">
  <div class="tb" data-a="left"  style="left:10px;bottom:70px">&#9664;</div>
  <div class="tb" data-a="right" style="left:120px;bottom:70px">&#9654;</div>
  <div class="tb" data-a="up"    style="left:65px;bottom:130px;width:56px;height:56px">&#9650;</div>
  <div class="tb" data-a="down"  style="left:65px;bottom:10px;width:56px;height:56px">&#9660;</div>
  <div class="tb" data-a="atk"   style="right:92px;bottom:20px">DISC</div>
  <div class="tb" data-a="jump"  style="right:12px;bottom:70px">JMP</div>
</div>
<!-- SOUNDTRACK HOOK: no music ships with this build. To add a soundtrack, put a tiny script here that sets
     window.SOUNDTRACK_URL = 'soundtrack.ogg' (and optionally window.SOUNDTRACK_FALLBACK_URL = 'soundtrack.mp3' for Safari/iOS).
     It starts on the first input, loops, ducks under SFX and obeys the mute toggle. build.py can also embed one as a data URI. -->
<!--MUSIC-->
<script>
'use strict';
/* =====================================================================
   RyOrb: RIFT OF AGES  (1985 // 2098)
   Rygar-style vertical climber. RyOrb, a scarred cyborg warrior with a
   spinning spiked disc-shield, climbs a tower that keeps tearing between
   a neon 1985 arcade city and a burning, machine-ruled 2098. Hunt the
   time portals, smash hunter drones and chrome sentinels, and topple the
   OMEGA SENTINEL at the summit. All art is procedural pixel art.
   Sections: 1 config/helpers, 2 audio, 3 input + autopilot,
             4 level + backgrounds, 5 game logic, 6 rendering, 7 loop
   ===================================================================== */

// ---------- 1. CONFIG / HELPERS ----------
const W = 320, H = 180;
const ATK_FRAMES = 20;
const DEMO = /[?&]demo/.test(location.search);       // ?demo = autopilot attract mode
const HERO = 'RyOrb';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
function resize() { const s = Math.min(innerWidth / W, innerHeight / H), sc = s >= 2 ? Math.floor(s) : s; cv.style.width = (W * sc) + 'px'; cv.style.height = (H * sc) + 'px'; }
addEventListener('resize', resize); resize();

const C = { out:'#0a0406', skin:'#c8806a', skin2:'#8a4a3a', band:'#c8d0d8', band2:'#7a8490', red:'#d0201a', red2:'#7a0a0a', red3:'#ff5a40',
  leather:'#6a3020', leather2:'#3a1a10', cloth:'#8a1a14', chrome:'#d8e2ec', chrome2:'#9aa8b6', chrome3:'#5a6674', chrome4:'#2a3038', eye:'#ff2a1a' };
const SPARKS = ['#ffffff', '#ffe08a', '#ffb030', '#ff6a20'];
const NEON = ['#ff2ad4', '#2af0ff', '#ffe23a', '#a05aff'];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
function seeded(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h, fn, seed = 1) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, seeded(seed), w, h); return c; }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function ellipse(cx, cy, rx, ry, c, g = ctx) { g.fillStyle = c; cx = Math.round(cx); cy = Math.round(cy); for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry)))); g.fillRect(cx - w, cy + dy, w * 2 + 1, 1); } }
function line(x0, y0, x1, y1, c, w = 1) { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0))); ctx.fillStyle = c; for (let i = 0; i <= n; i++) ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), w, w); }
function lerpC(a, b, t) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16); const ch = s => Math.round(((pa >> s) & 255) + (((pb >> s) & 255) - ((pa >> s) & 255)) * t); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col.replace('A', a)); g.addColorStop(1, col.replace('A', 0)); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = 'source-over'; }
// Draw [x,y,w,h,color] parts relative to (x,y), mirrored by facing f, with one shared outline.
function parts(x, y, f, list, flash, outline = C.out) {
  ctx.fillStyle = outline;
  for (const p of list) { const rx = f > 0 ? x + p[0] : x - p[0] - p[2]; ctx.fillRect(rx - 1, y + p[1] - 1, p[2] + 2, p[3] + 2); }
  for (const p of list) { const rx = f > 0 ? x + p[0] : x - p[0] - p[2]; ctx.fillStyle = flash ? '#fff' : p[4]; ctx.fillRect(rx, y + p[1], p[2], p[3]); }
}
function detail(x, y, f, list) { for (const p of list) { const rx = f > 0 ? x + p[0] : x - p[0] - p[2]; ctx.fillStyle = p[4]; ctx.fillRect(rx, y + p[1], p[2], p[3]); } }

// 3x5 bitmap font (+5x5 M/W, + the lowercase letters RyOrb needs)
const FONT = {A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
  '0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110','4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
  '!':'010010010000010','-':'000000111000000','.':'000000000000010',':':'000010000010000','/':'001001010100100',"'":'010010000000000',',':'000000000010100','?':'110001010000010','+':'000010111010000','(':'010100100100010',')':'010001001001010','%':'101001010100101',' ':'000000000000000',
  y:'000101101011110', r:'000101110100100', b:'100100110101110'};
const WIDE = { M: '1000111011101011000110001', W: '1000110001101011101101010' };
const glyphW = ch => WIDE[ch] ? 6 : 4;
const textW = s => { let w = 0; for (const ch of s) w += glyphW(ch); return w - 1; };
function glyphs(s, x, y, c, sc) {
  ctx.fillStyle = c; let cx = x;
  for (const ch of s) {
    if (WIDE[ch]) { const g = WIDE[ch]; for (let b = 0; b < 25; b++) if (g[b] === '1') ctx.fillRect(cx + (b % 5) * sc, y + ((b / 5) | 0) * sc, sc, sc); }
    else { const g = FONT[ch] || FONT['?']; for (let b = 0; b < 15; b++) if (g[b] === '1') ctx.fillRect(cx + (b % 3) * sc, y + ((b / 3) | 0) * sc, sc, sc); }
    cx += glyphW(ch) * sc;
  }
}
// Uppercases everything except the hero's name, which keeps its exact capitalisation.
const caps = s => String(s).toUpperCase().replace(/RYORB/g, HERO);
function text(s, x, y, c = '#fff', sc = 1, align = 'left', shadow = '#000') {
  s = caps(s); const w = textW(s) * sc;
  x = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x);
  if (shadow) glyphs(s, x + sc, y + sc, shadow, sc);
  glyphs(s, x, y, c, sc);
}

// ---------- 2. AUDIO (procedural SFX + optional soundtrack hook) ----------
const Snd = {
  ac: null, master: null, music: null, muted: false, duck: 1, noiseBuf: null,
  init() {
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.45; this.master.connect(this.ac.destination);
        const n = this.ac.sampleRate; this.noiseBuf = this.ac.createBuffer(1, n, n); const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      }
      if (window.SOUNDTRACK_URL) {               // soundtrack hook (off by default)
        this.music = new Audio(); this.music.loop = true;
        const ogg = this.music.canPlayType('audio/ogg; codecs="vorbis"') || this.music.canPlayType('audio/ogg; codecs="opus"');
        this.music.src = (!ogg && window.SOUNDTRACK_FALLBACK_URL) ? window.SOUNDTRACK_FALLBACK_URL : window.SOUNDTRACK_URL;
        this.music.volume = 0.5;
      }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
    this.playMusic();
  },
  playMusic() { if (this.music && this.music.paused && !this.muted) { const p = this.music.play(); if (p && p.catch) p.catch(() => {}); } },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.45;
    if (this.music) { if (this.muted) this.music.pause(); else this.playMusic(); }
    muteBtn.innerHTML = this.muted ? '&#128263;' : '&#128266;';
  },
  update() { this.duck += (1 - this.duck) * 0.03; if (this.music) this.music.volume = clamp(0.55 * this.duck, 0, 1); },
  tone(f, d, type = 'square', v = 0.15, f2 = 0, delay = 0) {
    if (!this.ac || this.muted) return; this.duck = Math.min(this.duck, 0.6);
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, v = 0.3, freq = 1000, type = 'lowpass', f2 = 0) {
    if (!this.ac || this.muted) return; this.duck = Math.min(this.duck, 0.6);
    const t = this.ac.currentTime, s = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = this.noiseBuf; fl.type = type; fl.frequency.setValueAtTime(freq, t); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
  }
};
const SFX = {
  swing()  { Snd.noise(0.14, 0.18, 3000, 'bandpass', 900); Snd.tone(320, 0.12, 'sawtooth', 0.04, 900); },
  hit()    { Snd.tone(900, 0.06, 'square', 0.08, 300); Snd.noise(0.08, 0.25, 3000); },
  boom()   { Snd.noise(0.5, 0.5, 900, 'lowpass', 80); Snd.tone(110, 0.4, 'sawtooth', 0.15, 30); },
  jump()   { Snd.tone(180, 0.12, 'square', 0.07, 360); },
  hurt()   { Snd.tone(300, 0.25, 'sawtooth', 0.14, 70); Snd.noise(0.12, 0.2, 1500); },
  laser()  { Snd.tone(1600, 0.14, 'square', 0.035, 300); },
  beam()   { Snd.tone(220, 0.8, 'sawtooth', 0.08, 180); Snd.noise(0.8, 0.15, 2500, 'bandpass'); },
  warp()   { Snd.tone(200, 0.7, 'sine', 0.2, 1600); Snd.tone(1600, 0.7, 'triangle', 0.08, 120); Snd.noise(0.6, 0.15, 4000, 'bandpass', 300); },
  bubble() { Snd.tone(60, 0.5, 'sawtooth', 0.1, 400); Snd.noise(0.4, 0.2, 5000, 'highpass'); },
  thud()   { Snd.tone(70, 0.18, 'square', 0.12, 35); Snd.noise(0.12, 0.2, 400); },
  step()   { Snd.tone(1200, 0.03, 'square', 0.02, 800); },
  climb()  { Snd.tone(700, 0.03, 'square', 0.03); },
  pickup() { Snd.tone(523, 0.08, 'square', 0.09); Snd.tone(784, 0.1, 'square', 0.09, 0, 0.08); Snd.tone(1046, 0.2, 'square', 0.09, 0, 0.16); },
  roar()   { Snd.noise(1.3, 0.45, 600, 'lowpass', 80); Snd.tone(55, 1.3, 'sawtooth', 0.22, 30); Snd.tone(880, 1.0, 'square', 0.04, 110); },
  die()    { Snd.tone(330, 0.9, 'sawtooth', 0.18, 40); Snd.noise(0.5, 0.35, 700, 'lowpass', 100); },
  quip()   { Snd.tone(440, 0.04, 'square', 0.04); Snd.tone(330, 0.05, 'square', 0.04, 0, 0.05); },
  start()  { Snd.tone(110, 0.6, 'sawtooth', 0.12, 55); Snd.noise(0.5, 0.3, 500); }
};

// ---------- 3. INPUT ----------
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right', ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyZ:'atk', KeyJ:'atk', KeyX:'jump', KeyK:'jump', Space:'jump', Enter:'start', KeyM:'mute', KeyP:'pause', Escape:'pause' };
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); if (a !== 'mute') Snd.init(); if (!keys[a]) pressed[a] = true; keys[a] = true; });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) keys[a] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); if (!Snd.ac) Snd.init(); Snd.toggleMute(); });
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');
document.querySelectorAll('.tb').forEach(b => {
  const a = b.dataset.a;
  const on = e => { e.preventDefault(); Snd.init(); if (!keys[a]) pressed[a] = true; keys[a] = true; b.classList.add('on'); if (mode !== 'play') pressed.start = true; };
  const off = e => { e.preventDefault(); keys[a] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
cv.addEventListener('pointerdown', () => { Snd.init(); if (mode !== 'play') pressed.start = true; });
function readInput() {
  if (DEMO && mode === 'play') return aiInput();
  return { left: keys.left, right: keys.right, up: keys.up, down: keys.down, atk: keys.atk, jump: keys.jump, atkP: pressed.atk, jumpP: pressed.jump };
}

// ---------- 4. LEVEL (seeded procedural tower) ----------
// One screen wide; y grows downward. Start floor at the bottom, the summit arena near y = 0.
const LEVEL = (() => {
  const r = seeded(1985), HGT = 1500, TOP_Y = 160, L = 16, R = 304;
  const plats = [], ropes = [], route = [];
  const add = (x, y, w, kind) => { const p = { x: Math.round(x), y: Math.round(y), w: Math.round(w), kind, i: plats.length }; plats.push(p); return p; };
  let prev = add(L, HGT - 12, R - L, 'floor'); route.push({ t: 'plat', p: prev });
  let y = prev.y, dir = 1;
  for (let guard = 0; guard < 200; guard++) {
    const rem = y - TOP_Y;
    if (rem <= 46) { prev = add(L, TOP_Y, R - L, 'summit'); route.push({ t: 'plat', p: prev }); break; }
    if (rem - 84 >= 30 && r() < 0.32) {                 // chain / cable climb
      const w = 56 + r() * 24, x = clamp(prev.x + prev.w / 2 - w / 2 + (r() - 0.5) * 70, L + 4, R - 4 - w);
      const a = Math.max(x, prev.x) + 8, b = Math.min(x + w, prev.x + prev.w) - 8;
      if (b > a) {
        const top = add(x, y - 84, w, 'ledge'), rope = { x: Math.round((a + b) / 2), y1: top.y, y2: prev.y - 3 };
        ropes.push(rope); route.push({ t: 'rope', r: rope }); route.push({ t: 'plat', p: top }); prev = top; y = top.y; continue;
      }
    }
    let step = 34 + r() * 10; if (rem - step < 30) step = rem - 30;
    const w = 46 + r() * 30; let x;
    if (prev.w > 200) x = L + 30 + r() * (R - L - 60 - w);
    else {
      if (r() < 0.3) dir = -dir;
      const place = d => d > 0 ? prev.x + prev.w + (r() * 40 - 30) : prev.x - w - (r() * 40 - 30);
      x = place(dir); if (x < L || x + w > R) { dir = -dir; x = place(dir); }
      x = clamp(x, L, R - w);
    }
    prev = add(x, y - step, w, 'ledge'); route.push({ t: 'plat', p: prev }); y = prev.y;
  }
  // time portals sit on route ledges, evenly spread up the climb (odd count => you arrive at the summit in 2098)
  const ledges = route.filter(n => n.t === 'plat' && n.p.kind === 'ledge').map(n => n.p), portals = [];
  const NP = 5; for (let k = 1; k <= NP; k++) { const p = ledges[Math.round(k * ledges.length / (NP + 1))]; portals.push({ x: p.x + p.w / 2, y: p.y - 14, plat: p, used: false }); }
  const waves = [{ y: HGT - 240, list: ['sentinel', 'drone'] }, { y: 1000, list: ['drone', 'drone', 'sentinel'] }, { y: 650, list: ['sentinel', 'sentinel', 'drone'] }, { y: 380, list: ['drone', 'sentinel', 'drone'] }];

})();
function supportAt(x, y) { for (const p of LEVEL.plats) if (Math.abs(p.y - y) < 0.5 && x >= p.x && x <= p.x + p.w) return p; return null; }
function landing(o, py) { // one-way (jump-through) platforms

  for (const p of LEVEL.plats) if (py <= p.y + 0.01 && o.y >= p.y && o.x >= p.x - 2 && o.x <= p.x + p.w + 2) { o.y = p.y; o.vy = 0; o.onGround = true; o.plat = p; return; }
}
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
const circRect = (cx, cy, r, x, y, w, h) => { const dx = cx - clamp(cx, x, x + w), dy = cy - clamp(cy, y, y + h); return dx * dx + dy * dy <= r * r; };

// ---------- pre-rendered backgrounds: 1985 (neon synthwave arcade city) ----------
const FAR85 = mk(W, 130, (g, r) => {
  let x = -4;
  while (x < W) {
    const w = 18 + r() * 34 | 0, h = 40 + r() * 80 | 0, top = 130 - h;
    g.fillStyle = r() < 0.5 ? '#1a0632' : '#22083c'; g.fillRect(x, top, w, h);
    g.fillStyle = r() < 0.5 ? '#ff2ad4' : '#2af0ff'; g.fillRect(x, top, w, 1);                     // neon roofline
    for (let wy = top + 4; wy < 128; wy += 5) for (let wx = x + 2; wx < x + w - 2; wx += 4) if (r() < 0.35) { g.fillStyle = pick2(r, ['#ffe23a', '#2af0ff', '#ff6ad8', '#7a3aa0']); g.fillRect(wx, wy, 2, 2); }
    if (r() < 0.35) { g.fillStyle = '#ff2ad4'; g.fillRect(x + w / 2 | 0, top - 14, 1, 14); g.fillStyle = '#ff5050'; g.fillRect(x + w / 2 | 0, top - 15, 1, 1); } // antenna
    x += w + (r() * 6 | 0);
  }
}, 21);
function pick2(r, a) { return a[(r() * a.length) | 0]; }
const MID85 = mk(W, 300, (g, r) => { // neighbouring skyscraper facades with billboards
  [[18, 70], [232, 70]].forEach(([bx, bw]) => {
    g.fillStyle = '#140426'; g.fillRect(bx, 0, bw, 300);
    for (let y = 4; y < 300; y += 7) for (let x = bx + 4; x < bx + bw - 4; x += 6) { const v = r(); g.fillStyle = v < 0.18 ? '#ffe23a' : v < 0.3 ? '#2af0ff' : v < 0.38 ? '#ff6ad8' : '#24103a'; g.fillRect(x, y, 3, 4); }
    g.fillStyle = r() < 0.5 ? '#ff2ad4' : '#2af0ff'; g.fillRect(bx, 0, 1, 300); g.fillRect(bx + bw - 1, 0, 1, 300);
  });
  for (let k = 0; k < 2; k++) { const y = 40 + k * 150, x = k ? 236 : 22; g.fillStyle = '#0a0214'; g.fillRect(x, y, 62, 26); g.fillStyle = k ? '#2af0ff' : '#ff2ad4'; g.fillRect(x, y, 62, 1); g.fillRect(x, y + 25, 62, 1); g.fillRect(x, y, 1, 26); g.fillRect(x + 61, y, 1, 26); }
}, 22);

      if (I.down && p.onGround && Math.abs(p.y - r.y1) < 1) { p.climb = r; p.y += 3; break; }
    }

  }

    const r = p.climb; p.x += (r.x - p.x) * 0.5;
    if (I.left) p.face = -1; if (I.right) p.face = 1;
    p.vy = (I.up ? -1.25 : I.down ? 1.5 : 0) * (p.atk ? 0.5 : 1); p.y += p.vy;

  if (mode === 'gameover') { ctx.fillStyle = 'rgba(10,0,0,' + Math.min(0.75, G.stateT / 80) + ')'; ctx.fillRect(0, 0, W, H); text('TIMELINE TERMINATED', W / 2, 60, '#ff2a1a', 2, 'center', '#000'); text('THE MACHINES INHERIT THE FUTURE. AND THE PAST.', W / 2, 88, '#fff', 1, 'center'); text('SCORE ' + G.score, W / 2, 100, '#ffe23a', 1, 'center'); if (G.stateT > 60 && (G.stateT >> 5) & 1) text('PRESS Z TO TRY AGAIN', W / 2, 122, '#ffd0c0', 1, 'center'); }
  if (mode === 'clear') { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.65, G.stateT / 80) + ')'; ctx.fillRect(0, 0, W, H); text('TIMELINE SECURED', W / 2, 46, '#ff2a1a', 3, 'center', '#000');
    text('THE OMEGA SENTINEL IS SCRAP. RyOrb RIDES ON.', W / 2, 80, '#fff', 1, 'center'); text('PORTALS ' + G.portals + '/' + LEVEL.portals.length + '   SCORE ' + G.score, W / 2, 92, '#ffe23a', 1, 'center');
    if (G.stateT > 60 && (G.stateT >> 5) & 1) text('PRESS Z TO PLAY AGAIN', W / 2, 120, '#ffd0c0', 1, 'center'); }
}

// ---------- 7. MAIN LOOP (fixed 60Hz step) ----------
let last = performance.now(), acc = 0;
function step() { const I = readInput(); update(I); for (const k in pressed) pressed[k] = false; Snd.update(); }
function frame(now) { acc += Math.min(100, now - last); last = now; while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; } render(); requestAnimationFrame(frame); }
window.__game = { step: () => step(), get mode() { return mode; }, get G() { return G; }, get P() { return P; }, LEVEL };   // test hook
requestAnimationFrame(frame);
</script>
